name: CI

on:
  push:
    # `phase/**` verifies merges ONTO the collector branch too (#242 / NEW-2);
    # the `tag` job stays main-only, so a collector push can never release.
    branches: [main, 'phase/**']
  pull_request:
    branches: [main, 'phase/**', 'feature/**']

jobs:
  lint:
    name: Lint Workflows
    # Pinned: this job builds the actionlint Docker image, so the runner's
    # Docker engine must not change without a commit (#242 / Defect B).
    # Moved to ubuntu-26.04 in #352 after this exact job went green there; the
    # recording step below is what makes the NEXT move evidence-led, not a guess.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Issue #352 / AC-1: the pin is only defensible if the environment that
      # actually ran is in the log — the engine is what #347 was de-risking.
      - name: Record runner image, engine and kernel
        run: |
          . /etc/os-release
          echo "runner: ${PRETTY_NAME:-unknown}"
          echo "kernel: $(uname -r)"
          echo "docker: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo absent)"
          echo "podman: $(podman --version 2>/dev/null || echo absent)"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Verify package-lock.json is in sync with package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # ubuntu-latest ships bash and a working git clone, which hides bash-only
  # constructs in bin/. This leg runs the suite inside Alpine, where /bin/sh is
  # busybox ash and no bash is installed at all, so a `#!/usr/bin/env bash`
  # shebang or a ${BASH_SOURCE[0]} / `&>` / `[[ ]]` construct fails loudly.
  #
  # SOAK (non-blocking): this job is brand new and depends on a network image
  # pull, an `apk add`, and containerisation. Until it has a few green runs on
  # main it must not be able to block a release, so it carries
  # `continue-on-error: true` and `tag` does NOT depend on it. Promote it by
  # dropping `continue-on-error` here and adding `posix-shell` to `tag.needs`.
  posix-shell:
    name: POSIX Shell (Alpine)
    # Pinned: this job bind-mounts $PWD into a container, so the runner's
    # Docker engine and kernel must not change without a commit (#242 / Defect B).
    # Moved to ubuntu-26.04 in #352 after this exact job went green there. It runs
    # rootful, so the container is root while /work belongs to the runner
    # (uid 1001): a future in-container `git` call against /work must pass
    # safe.directory itself — the runner-side config is invisible in here.
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Issue #352 / AC-2: the pin is only defensible if the environment that
      # actually ran is in the log — the engine is what #347 was de-risking.
      - name: Record runner image, engine and kernel
        run: |
          . /etc/os-release
          echo "runner: ${PRETTY_NAME:-unknown}"
          echo "kernel: $(uname -r)"
          echo "docker: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo absent)"
          echo "podman: $(podman --version 2>/dev/null || echo absent)"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # GitHub's ubuntu runners ship Docker as a managed service; rootless podman
      # needs newuidmap//etc/subuid provisioning that is not guaranteed. Because
      # this job bind-mounts $PWD, uid mapping is load-bearing, so prefer Docker
      # and only fall back to podman.
      - name: Confirm bash is genuinely absent inside the container
        run: |
          if command -v docker >/dev/null 2>&1; then R=docker; else R=podman; fi
          "$R" run --rm docker.io/library/node:24-alpine sh -c \
            'if command -v bash >/dev/null 2>&1; then echo "::error::bash unexpectedly present in image"; exit 1; fi; ls -l /bin/sh'
      - name: Build and typecheck
        run: |
          if command -v docker >/dev/null 2>&1; then R=docker; else R=podman; fi
          "$R" run --rm -v "$PWD:/work" -w /work docker.io/library/node:24-alpine \
            sh -c 'npm run build && npm run typecheck'
      - name: Test
        run: |
          if command -v docker >/dev/null 2>&1; then R=docker; else R=podman; fi
          "$R" run --rm -v "$PWD:/work" -w /work docker.io/library/node:24-alpine \
            sh -c 'apk add --no-cache git jq && node --test tests/*.test.ts tests/**/*.test.ts'
      - name: Launcher smoke test under a POSIX shell
        run: |
          if command -v docker >/dev/null 2>&1; then R=docker; else R=podman; fi
          # shellcheck disable=SC2016  # single quotes are deliberate: the script runs in the container, not on the runner
          "$R" run --rm -v "$PWD:/work" -w /work docker.io/library/node:24-alpine sh -c '
            set -e
            for s in codeloop agyloop setup-symlink.sh verify-install.sh; do
              sh -n "bin/$s" || { echo "::error::bin/$s is not valid POSIX shell"; exit 1; }
            done
            echo "all bin/ scripts pass sh -n"

            ./bin/codeloop --help >/tmp/codeloop.out 2>/tmp/codeloop.err
            grep -q "^Usage:" /tmp/codeloop.out || { echo "::error::codeloop: no Usage: on stdout"; cat /tmp/codeloop.err; exit 1; }
            if grep -qi deprecated /tmp/codeloop.err; then
              echo "::error::codeloop: unexpected deprecation notice"; cat /tmp/codeloop.err; exit 1
            fi
            echo "codeloop --help OK"

            ./bin/agyloop --help >/tmp/agyloop.out 2>/tmp/agyloop.err
            grep -q "^Usage:" /tmp/agyloop.out || { echo "::error::agyloop: no Usage: on stdout"; cat /tmp/agyloop.err; exit 1; }
            grep -q "Warning: The .agyloop. command is deprecated. Please use .codeloop. instead." /tmp/agyloop.err \
              || { echo "::error::agyloop: missing exact deprecation notice"; cat /tmp/agyloop.err; exit 1; }
            echo "agyloop --help OK"
          '
      - name: Installer scripts under a POSIX shell
        run: |
          if command -v docker >/dev/null 2>&1; then R=docker; else R=podman; fi
          # node:24-alpine ships no jq, so install it here; without it
          # verify-install.sh silently skips steps 3-4 (JSON + manifest contract
          # validation), which are exactly the checks this job is meant to cover.
          # shellcheck disable=SC2016  # single quotes are deliberate: the script runs in the container, not on the runner
          "$R" run --rm -v "$PWD:/work" -w /work docker.io/library/node:24-alpine sh -c '
            set -e
            apk add --no-cache jq
            export HOME=/tmp/fakehome
            mkdir -p "$HOME"
            ./bin/setup-symlink.sh
            ./bin/setup-symlink.sh
            ./bin/verify-install.sh
          '

  tag:
    name: Auto-Tag & Release
    # Pinned: this job force-pushes release tags, so its environment must not
    # change without a commit (#242 / Defect B). Moved to ubuntu-26.04 in #352
    # only after the force-push path was replayed on a scratch fork: a wrong tag
    # here moves silently, so the image must not be the variable.
    runs-on: ubuntu-26.04
    # posix-shell is intentionally absent: it is still soaking (see above) and a
    # container/network flake there must not block a release from main.
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Run Auto-Tag
        id: auto-tag
        uses: ajxcodes/auto-tag@1c74094c93631b1319390dae21e46b0a325a8bc7 # v1.2.3
        with:
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          default-bump: patch
          package-json: 'true'
          create-release: 'true'

      - name: Update Floating Tags
        if: steps.auto-tag.outputs.bumped == 'true'
        run: |
          NEW_TAG="${{ steps.auto-tag.outputs.new-tag }}"
          MAJOR_TAG=$(echo "$NEW_TAG" | cut -d. -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR_TAG" "$NEW_TAG"
          git tag -f "${MAJOR_TAG}.x" "$NEW_TAG"
          git tag -f "latest" "$NEW_TAG"
          git push -f origin "$MAJOR_TAG" "${MAJOR_TAG}.x" "latest"
