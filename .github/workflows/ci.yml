name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm test

  tag:
    name: Auto-Tag & Release
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Run Auto-Tag
        id: auto-tag
        uses: ajxcodes/auto-tag@latest
        with:
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          default-bump: patch
          package-json: 'true'
          create-release: 'true'

      - name: Update Floating Tags
        if: steps.auto-tag.outputs.bumped == 'true'
        run: |
          NEW_TAG="${{ steps.auto-tag.outputs.new-tag }}"
          MAJOR_TAG=$(echo "$NEW_TAG" | cut -d. -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR_TAG" "$NEW_TAG"
          git tag -f "${MAJOR_TAG}.x" "$NEW_TAG"
          git tag -f "latest" "$NEW_TAG"
          git push -f origin "$MAJOR_TAG" "${MAJOR_TAG}.x" "latest"
